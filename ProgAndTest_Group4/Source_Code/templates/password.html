{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block body %}
<div class="sky"><form class="card" method="post">
  <h2 class="center" style="margin:0">Change password</h2>
  <p>The new password must include uppercase letters, lowercase letters, numbers, and special characters.</p>
  <label>Old password</label><input type="password" name="old" required>
  <label>New password</label><input type="password" name="new" required>
  <label>confirm password</label><input type="password" name="new2" required><br>
  <button class="btn btn-block">Enter</button>
  <p class="right"><a href="{{ url_for('guest.home') }}"><b>Back to Home</b></a></p>
</form></div>
{% endblock %}
