{% extends 'admin/_layout.html' %}{% block heading %}Create customer account{% endblock %}
{% block content %}
<form class="form-white" method="post"><div class="fields">
  <div><label>Full name</label><input name="name" required></div><div><label>Sex</label><select name="sex"><option>Male</option><option>Female</option></select></div>
  <div><label>Phone number</label><input name="phone" required></div><div><label>Address</label><input name="address"></div>
  <div><label>Day of birth</label><input type="date" name="dob"></div><div><label>Email (optional)</label><input name="email" type="email"></div>
  <div><label>Temporary password</label><input name="pw" required></div><div><label>Identity card</label><input name="idcard" required></div></div>
  <h3>Booking for guest (optional)</h3><div class="fields">
  <div><label>Booking room</label><select name="rid"><option value="">— No booking —</option>{% for r in rooms %}<option value="{{ r.id }}">{{ r.code }} (${{ r.price|int }}/night, {{ r.cap }} guests)</option>{% endfor %}</select></div>
  <div><label>Check-in</label><input type="date" name="cin" min="{{ today }}"></div><div><label>Check-out</label><input type="date" name="cout" min="{{ today }}"></div>
  <div><label>Adults</label><input type="number" name="adults" min="1" value="1"></div><div><label>Children</label><input type="number" name="kids" min="0" value="0"></div>
  <div><label>Payment</label><select disabled><option>Pay at hotel</option></select></div></div><br>
  <button class="btn">Create account</button> <a href="{{ url_for('admin.users') }}" style="margin-left:16px"><b>Cancel</b></a>
</form>
{% endblock %}
